<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Z-Network — My Plan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface-soft:#f8faff;--text:#111827;
  --muted:#7c879c;--line:#e7ebf2;--accent:#246bfe;--accent-dark:#1554d1;
  --green:#12a36a;--red:#e05252;--shadow:0 24px 70px rgba(24,45,86,.10);
  --shadow-soft:0 10px 30px rgba(24,45,86,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;background:radial-gradient(circle at 10% 0%,rgba(36,107,254,.08),transparent 30%),radial-gradient(circle at 100% 100%,rgba(18,163,106,.06),transparent 28%),var(--bg);
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;padding:28px 16px;
}
button,input{font:inherit}button{cursor:pointer}
.portal-shell{width:100%;max-width:720px;margin:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--text);color:#fff;font-size:20px;box-shadow:0 10px 24px rgba(17,24,39,.18)}
.brand-name{font-size:1rem;font-weight:800;letter-spacing:-.02em}
.brand-sub{color:var(--muted);font-size:.72rem;margin-top:2px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:30px;margin-bottom:16px;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(36,107,254,.06);right:-130px;top:-150px;pointer-events:none}
.hero-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;position:relative;z-index:1}
.eyebrow{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.11em;font-weight:800;margin-bottom:8px}
.customer-name{font-size:clamp(1.8rem,4vw,2.7rem);letter-spacing:-.06em;font-weight:850;line-height:1}
.customer-id{color:var(--muted);font-size:.78rem;margin-top:9px}
.status-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap;background:rgba(18,163,106,.10);color:var(--green)}
.status-pill.expired,.status-pill.paused{background:rgba(224,82,82,.10);color:var(--red)}
.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.plan-card{margin-top:28px;border:1px solid #dfe7f5;background:linear-gradient(135deg,#f7faff,#fff);border-radius:22px;padding:22px;position:relative;z-index:1}
.plan-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.plan-label{color:var(--muted);font-size:.72rem;text-transform:uppercase;font-weight:800;letter-spacing:.08em}
.plan-name{font-size:1.4rem;font-weight:850;letter-spacing:-.04em;margin-top:6px}
.countdown{font-size:clamp(1.7rem,5vw,2.8rem);font-weight:850;letter-spacing:-.06em;margin-top:24px}
.countdown.active{color:var(--green)}.countdown.expired,.countdown.paused{color:var(--red)}
.expiry-label{color:var(--muted);font-size:.75rem;margin-top:4px}
.quick-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:22px}
.btn{border:none;border-radius:13px;padding:13px 16px;font-size:.82rem;font-weight:800;transition:.2s ease}
.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-dark)}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--text)}.btn-red{background:var(--red);color:#fff}.btn-green{background:var(--green);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.section{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-soft);padding:22px;margin-bottom:16px}
.section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.section-title{font-size:1rem;font-weight:850;letter-spacing:-.025em}.section-subtitle{color:var(--muted);font-size:.74rem;margin-top:4px}
.topup-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.topup{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.topup-name{font-size:.78rem;font-weight:800}.topup-price{font-size:1.2rem;font-weight:850;margin:10px 0 14px}.topup .btn{width:100%;padding:10px;font-size:.72rem}
.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.profile-item{border:1px solid var(--line);border-radius:15px;padding:14px;background:var(--surface-soft)}.profile-label{color:var(--muted);font-size:.68rem;margin-bottom:5px}.profile-value{font-size:.82rem;font-weight:800}
.admin-toggle{text-align:center;color:var(--muted);font-size:.72rem;cursor:pointer;text-decoration:underline;margin-top:18px}.admin-panel{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.admin-panel.show{display:block}
input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;outline:none}input:focus{border-color:var(--accent)}
.error{display:none;color:var(--red);font-size:.75rem;margin-bottom:10px}.error.show{display:block}
.footer{text-align:center;color:var(--muted);font-size:.68rem;padding:8px 0 2px}.loading,.notfound{max-width:420px;margin:auto;text-align:center;padding:70px 20px;color:var(--muted)}
@media(max-width:760px){body{padding:14px 10px}.hero{padding:22px 18px;border-radius:22px}.section{padding:18px;border-radius:19px}.topup-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.hero-head{gap:12px}.status-pill{font-size:.64rem;padding:7px 9px}.customer-name{font-size:2rem}.topup-grid{gap:8px}.topup{padding:13px 11px}.profile-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="portal-shell" id="app">
  <div class="loading">Loading your plan…</div>
</main>

<script>
var SUPABASE_URL='https://yohndnmwvgcwadkytmix.supabase.co';
var SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvaG5kbm13dmdjd2Fka3l0bWl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDEyODgsImV4cCI6MjA5NDYxNzI4OH0.hkUexJ-AS1GpLJL78F7iXDv5PkwuPbShj2fsGVXuEsg';
var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

var params=new URLSearchParams(window.location.search);
var TOKEN=params.get('t')||'';

// Same plan catalog as admin.html — real product prices, not fake data.
var PLANS_STATIC=[
  {name:'Daily',hours:24,price:350},
  {name:'2-Day',hours:48,price:500},
  {name:'Half-Week',hours:84,price:1000},
  {name:'Weekly',hours:168,price:2000},
  {name:'Monthly',hours:720,price:6000}
];

function getCountdown(expiryIso){
  if(!expiryIso)return'—';
  var diff=new Date(expiryIso).getTime()-Date.now();
  var neg=diff<=0;var abs=Math.abs(diff);
  var d=Math.floor(abs/86400000),h=Math.floor((abs%86400000)/3600000),m=Math.floor((abs%3600000)/60000);
  var str=d>0?(d+'d '+h+'h '+m+'m'):(h>0?(h+'h '+m+'m'):m+'m');
  return neg?('Expired '+str+' ago'):str;
}

var _customer=null;

async function loadPortal(){
  if(!TOKEN){renderNotFound();return;}
  var{data,error}=await supabase.rpc('rpc_get_customer_by_token',{p_token:TOKEN});
  if(error||!data||!data.length){renderNotFound();return;}
  _customer=data[0];
  renderCustomer();
}

function renderNotFound(){
  document.getElementById('app').innerHTML='<div class="notfound">This link isn\'t valid. Please contact Z-Network to get your correct link.</div>';
}

function renderCustomer(){
  var c=_customer;
  var isPaused=c.status==='suspended';
  var isExpired=!isPaused && c.expiry_date && new Date(c.expiry_date).getTime()<=Date.now();
  var cls=isPaused?'paused':(isExpired?'expired':'active');
  var label=isPaused?'Paused':(isExpired?'Expired':'Active');

  document.getElementById('app').innerHTML=
    '<div class="topbar"><div class="brand"><div class="brand-mark">⌁</div><div><div class="brand-name">Z-Network</div><div class="brand-sub">Customer portal</div></div></div></div>'+

    '<section class="hero">'+
      '<div class="hero-head">'+
        '<div><div class="eyebrow">Welcome back</div><div class="customer-name">'+(c.name||'—')+'</div>'+
        '<div class="customer-id">Customer ID · '+(c.customer_number||'—')+'</div></div>'+
        '<div class="status-pill '+cls+'"><span class="status-dot"></span>'+label+'</div>'+
      '</div>'+
      '<div class="plan-card">'+
        '<div class="plan-top"><div><div class="plan-label">Current plan</div><div class="plan-name">'+(c.plan_name||'No active plan')+'</div></div></div>'+
        '<div class="countdown '+cls+'">'+(isPaused?'—':getCountdown(c.expiry_date))+'</div>'+
        '<div class="expiry-label">'+(isPaused?'Your subscription is paused':(isExpired?'Your plan has expired':'Time remaining on your current subscription'))+'</div>'+
        '<div class="quick-actions"><button class="btn btn-primary" onclick="document.getElementById(\'topupSection\').scrollIntoView({behavior:\'smooth\'})">View plans</button></div>'+
      '</div>'+
    '</section>'+

    '<section class="section" id="topupSection">'+
      '<div class="section-heading"><div><div class="section-title">Available plans</div>'+
      '<div class="section-subtitle">Self-service top-up is coming soon — contact us on WhatsApp to renew for now</div></div></div>'+
      '<div class="topup-grid">'+
        PLANS_STATIC.map(function(p){
          return'<div class="topup"><div class="topup-name">'+p.name+'</div><div class="topup-price">₦'+p.price.toLocaleString('en-NG')+'</div><button class="btn btn-outline" disabled title="Coming soon">Coming soon</button></div>';
        }).join('')+
      '</div>'+
    '</section>'+

    '<section class="section"><div class="section-heading"><div><div class="section-title">Customer information</div>'+
      '<div class="section-subtitle">Your account details</div></div></div>'+
      '<div class="profile-grid">'+
        '<div class="profile-item"><div class="profile-label">Name</div><div class="profile-value">'+(c.name||'—')+'</div></div>'+
        '<div class="profile-item"><div class="profile-label">Customer number</div><div class="profile-value">'+(c.customer_number||'—')+'</div></div>'+
      '</div>'+
    '</section>'+

    '<div class="footer">Z-Network · Reliable internet, made simple</div>'+
    '<div class="admin-toggle" onclick="showAdminLogin()">Admin? Tap here</div>'+
    '<div class="admin-panel" id="adminPanel">'+
      '<div class="error" id="pinError">Incorrect PIN.</div>'+
      '<input type="password" id="pinInput" placeholder="Admin PIN" inputmode="numeric"/>'+
      '<button class="btn btn-outline" style="width:100%" onclick="unlockAdmin()">Unlock</button>'+
      '<div id="adminActions" style="display:none;margin-top:14px;">'+
        (isPaused?'<div id="continuePickerSlot">Loading plans…</div>':'<button class="btn btn-red" style="width:100%" id="pauseBtn" onclick="doPause()">⏸ Pause Subscription</button>')+
      '</div>'+
    '</div>';

  if(!isPaused && c.expiry_date){
    setInterval(function(){
      var el=document.querySelector('.countdown');
      if(el)el.textContent=getCountdown(c.expiry_date);
    },30000);
  }
}

function showAdminLogin(){
  document.getElementById('adminPanel').classList.add('show');
}

async function unlockAdmin(){
  var pin=document.getElementById('pinInput').value;
  var errEl=document.getElementById('pinError');
  errEl.classList.remove('show');
  if(!pin){return;}
  var{data,error}=await supabase.rpc('rpc_verify_portal_pin',{p_pin:pin});
  if(error||!data){errEl.classList.add('show');return;}
  document.getElementById('adminActions').style.display='block';
  if(_customer.status==='suspended')renderContinuePicker();
  document.getElementById('pinInput').style.display='none';
  document.querySelector('#adminPanel .btn-outline').style.display='none';
  window._portalPin=pin; // held in memory only for this session's action call, never stored
}

async function doPause(){
  var c=_customer;
  if(!confirm('Pause this subscription now?'))return;
  var{data,error}=await supabase.rpc('rpc_portal_pause',{p_token:TOKEN,p_pin:window._portalPin});
  if(error||!data){alert('Failed to pause. Please try again.');return;}
  await loadPortal();
  showAdminLogin();
  document.getElementById('adminActions').style.display='block';
}

var PLANS_CACHE=null;
async function renderContinuePicker(){
  var{data}=await supabase.from('plans').select('id,name,amount,duration_hours').order('amount');
  PLANS_CACHE=data||[];
  var slot=document.getElementById('continuePickerSlot');
  if(!slot)return;
  slot.innerHTML='<div style="font-size:0.8rem;font-weight:700;margin-bottom:8px;">Pick a plan to continue:</div>'+
    PLANS_CACHE.map(function(p){
      return'<button class="btn btn-outline" style="width:100%;text-align:left;margin-bottom:8px;" onclick="doContinue(\''+p.id+'\')">'+p.name+' — ₦'+p.amount+' ('+p.duration_hours+'h)</button>';
    }).join('');
}

async function doContinue(planId){
  var plan=PLANS_CACHE.find(function(p){return p.id===planId;});
  if(!confirm('Continue with '+(plan?plan.name:'this plan')+'?'))return;

  var waTab=window.open('','_blank'); // open synchronously before the await, or it gets blocked

  var{data,error}=await supabase.rpc('rpc_portal_continue',{p_token:TOKEN,p_pin:window._portalPin,p_plan_id:planId});
  if(error||!data||!data.ok){
    if(waTab)waTab.close();
    alert('Failed: '+(data&&data.error?data.error:(error?error.message:'unknown error')));
    return;
  }

  if(data.whatsapp){
    var name=data.name||'there';
    var expiryStr=new Date(data.expiry_date).toLocaleString('en-NG',{weekday:'long',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    var msg='Hi '+name+' 👋\n\nYour plan has been *renewed* and you\'re back online! ✅\n\n'+
      '📦 Plan: *'+data.plan_name+'*\n💰 Amount: ₦'+data.amount+'\n⏰ Valid until: *'+expiryStr+'*\n\nEnjoy! 🌐';
    var phone=data.whatsapp.replace(/[^0-9]/g,'').replace(/^0/,'234');
    var waUrl='https://wa.me/'+phone+'?text='+encodeURIComponent(msg);
    if(waTab){waTab.location.href=waUrl;}else{window.open(waUrl,'_blank');}
  }else if(waTab){
    waTab.close();
  }

  await loadPortal();
  showAdminLogin();
  document.getElementById('adminActions').style.display='block';
}

loadPortal();
</script>
</body>
</html>
