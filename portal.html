async function fetchPlans(){

function getBlackoutCredit(startedAtIso){
  if(!startedAtIso)return'+0m';
  var diff=Date.now()-new Date(startedAtIso).getTime();
  if(diff<0)diff=0;
  var h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000);
  return'+'+(h>0?(h+'h '+m+'m'):(m+'m'));
}
function getCountdown(expiryIso){
  if(!expiryIso)return'—';
  var diff=new Date(expiryIso).getTime()-Date.now();
  var neg=diff<=0;var abs=Math.abs(diff);
  var d=Math.floor(abs/86400000),h=Math.floor((abs%86400000)/3600000),m=Math.floor((abs%3600000)/60000);
  var str=d>0?(d+'d '+h+'h '+m+'m'):(h>0?(h+'h '+m+'m'):m+'m');
  return neg?('Expired '+str+' ago'):str;
}

var _activeOutage=null;

async function loadPortal(){
  if(!TOKEN){renderNotFound();return;}

  if(error||!data||!data.length){renderNotFound();return;}
  _customer=data[0];

  var{data:outageData}=await supabase.rpc('rpc_get_active_outage');
  _activeOutage=(outageData&&outageData[0]&&outageData[0].is_active)?outageData[0]:null;

  renderCustomer();
}

function znCopyVoucher(){
  var code=_customer&&_customer.voucher_code;

  else{var ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();ok();}
}

  document.getElementById('adminPanel').classList.add('show');
}

async function unlockAdmin(){
  var pin=document.getElementById('pinInput').value;
  var errEl=document.getElementById('pinError');
  errEl.classList.remove('show');
  if(!pin){return;}
  var{data,error}=await supabase.rpc('rpc_verify_portal_pin',{p_pin:pin});
  if(error||!data){errEl.classList.add('show');return;}
   document.getElementById('adminActions').style.display='block';
  if(_customer.status==='suspended'||_isExpired)renderContinuePicker();
  document.getElementById('pinInput').style.display='none';
  document.querySelector('#adminPanel .btn-outline').style.display='none';
  window._portalPin=pin; // held in memory only for this session's action call, never stored
}

async function doPause(){
  var c=_customer;
  if(!confirm('Pause this subscription now?'))return;
  var{data,error}=await supabase.rpc('rpc_portal_pause',{p_token:TOKEN,p_pin:window._portalPin});

  await loadPortal();
  showAdminLogin();
  document.getElementById('adminActions').style.display='block';
}
function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function doRename(){
  var input=document.getElementById('renameInput');
  var btn=document.getElementById('renameBtn');
  var name=(input.value||'').trim();
  if(!name){alert('Name cannot be empty.');return;}
  if(name===(_customer.name||''))return;
  if(!confirm('Change customer name to "'+name+'"?'))return;
  btn.disabled=true;
  var{data,error}=await supabase.rpc('rpc_portal_rename',{p_token:TOKEN,p_pin:window._portalPin,p_name:name});
  btn.disabled=false;
  if(error||!data||!data.ok){alert('Failed to rename: '+(data&&data.error?data.error:(error?error.message:'unknown error')));return;}
  await loadPortal();
  showAdminLogin();
  document.getElementById('adminActions').style.display='block';
}

  
var PLANS_CACHE=null;
async function renderContinuePicker(){
  var{data}=await supabase.from('plans').select('id,name,amount,duration_hours').order('amount');
  PLANS_CACHE=data||[];
  var slot=document.getElementById('continuePickerSlot');
  if(!slot)return;
  slot.innerHTML='<div style="font-size:0.8rem;font-weight:700;margin-bottom:8px;">Pick a plan to continue:</div>'+
    PLANS_CACHE.map(function(p){
      return'<button class="btn btn-outline" style="width:100%;text-align:left;margin-bottom:8px;" onclick="doContinue(\''+p.id+'\')">'+p.name+' — ₦'+p.amount+' ('+p.duration_hours+'h)</button>';
    }).join('');
}

async function doContinue(planId){
  var plan=PLANS_CACHE.find(function(p){return p.id===planId;});
  if(!confirm('Continue with '+(plan?plan.name:'this plan')+'?'))return;

  var waTab=window.open('','_blank'); // open synchronously before the await, or it gets blocked

  var{data,error}=await supabase.rpc('rpc_portal_continue',{p_token:TOKEN,p_pin:window._portalPin,p_plan_id:planId});
  if(error||!data||!data.ok){
    if(waTab)waTab.close();
    alert('Failed: '+(data&&data.error?data.error:(error?error.message:'unknown error')));
    return;
  }

  if(data.whatsapp){
    var name=data.name||'there';
    var expiryStr=new Date(data.expiry_date).toLocaleString('en-NG',{weekday:'long',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    var msg='Hi '+name+' 👋\n\nYour plan has been *renewed* and you\'re back online! ✅\n\n'+
      '📦 Plan: *'+data.plan_name+'*\n💰 Amount: ₦'+data.amount+'\n⏰ Valid until: *'+expiryStr+'*\n\nEnjoy! 🌐';
    var phone=data.whatsapp.replace(/[^0-9]/g,'').replace(/^0/,'234');
    var waUrl='https://wa.me/'+phone+'?text='+encodeURIComponent(msg);
    if(waTab){waTab.location.href=waUrl;}else{window.open(waUrl,'_blank');}
  }else if(waTab){
    waTab.close();
  }

  await loadPortal();
  showAdminLogin();
  document.getElementById('adminActions').style.display='block';
}
  function buyPlan(planId, planName, amountNaira){
  var btn = document.getElementById('buy-'+planId);
  var resultEl = document.getElementById('buyResult');
  var c = _customer;

  var handler = PaystackPop.setup({
    key: PAYSTACK_PUBLIC_KEY,
    email: 'znetworkmarket@gmail.com',
    amount: Math.round(amountNaira*100),
    currency: 'NGN',
    metadata: {
      custom_fields: [
        {display_name:'Customer', variable_name:'customer_number', value:c.customer_number||''},
        {display_name:'Plan', variable_name:'plan_name', value:planName}
      ]
    },
    callback: function(response){
      btn.disabled = true;
      btn.textContent = 'Confirming…';
      fetch(PAYSTACK_FN_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ reference: response.reference, plankey: planId, token: TOKEN, mode: 'extend' })
      })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.success && data.extend && data.extend.ok){
          var exp = new Date(data.extend.expiry_date).toLocaleString('en-NG',{weekday:'long',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
          resultEl.innerHTML =
            '<div style="border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface-soft);">'+
              '<div style="font-size:.75rem;color:var(--muted);margin-bottom:6px;">Payment confirmed — you\'re renewed ✅</div>'+
              '<div style="font-size:1.1rem;font-weight:850;">'+data.extend.plan_name+' active until</div>'+
              '<div style="font-size:1.3rem;font-weight:850;margin-top:2px;">'+exp+'</div>'+
            '</div>';
          resultEl.scrollIntoView({behavior:'smooth'});
          loadPortal(); // refresh hero countdown/status to reflect new expiry
        } else {
          alert('Payment succeeded but renewal failed: '+(data.message||'unknown error')+'\nYour reference: '+response.reference+' — contact Z-Network with this reference, you will not be charged again.');
        }
        btn.disabled = false;
        btn.textContent = 'Buy Now';
      })
      .catch(function(err){
        alert('Payment succeeded but we could not confirm it automatically. Contact Z-Network with reference: '+response.reference);
        btn.disabled = false;
        btn.textContent = 'Buy Now';
      });
    },
    onClose: function(){}
  });
  handler.openIframe();
}

loadPortal();
</script>
